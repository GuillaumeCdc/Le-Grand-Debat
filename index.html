<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Le Grand Débat · le jeu de la Ve République</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b2a6f'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23d6202f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,700;1,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bleu:#0b2a6f;--rouge:#d6202f;--blanc:#ffffff;
  --bg:#f6f2ea;--hd:rgba(246,242,234,.92);--surf:#ffffff;--surf2:#efe9dc;
  --ink:#0c1a3a;--ink2:#4b5879;--line:rgba(12,26,58,.13);
  --btn2:#ffffff;--btn2ink:#0c1a3a;
  --shadow:0 12px 32px rgba(8,22,60,.14);--shadow2:0 4px 14px rgba(8,22,60,.12);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050f2b;--hd:rgba(5,15,43,.92);--surf:#0d1c44;--surf2:#13275a;
    --ink:#f3f5fb;--ink2:#a9b6d6;--line:rgba(255,255,255,.15);
    --btn2:#13275a;--btn2ink:#f3f5fb;
    --shadow:0 14px 36px rgba(0,0,0,.55);--shadow2:0 4px 16px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050f2b;--hd:rgba(5,15,43,.92);--surf:#0d1c44;--surf2:#13275a;
  --ink:#f3f5fb;--ink2:#a9b6d6;--line:rgba(255,255,255,.15);
  --btn2:#13275a;--btn2ink:#f3f5fb;
  --shadow:0 14px 36px rgba(0,0,0,.55);--shadow2:0 4px 16px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 420px at 85% -80px,rgba(214,32,47,.10),transparent 60%),
    radial-gradient(900px 480px at 5% -120px,rgba(11,42,111,.16),transparent 60%);
  background-repeat:no-repeat;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:60}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #6aa0ff;outline-offset:2px}
em{font-style:italic}
h1,h2,h3{font-family:var(--serif);line-height:1.1;letter-spacing:-.01em}

/* ===== en-tête ===== */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.flagbar{display:flex;height:4px}
.flagbar i{flex:1}
.flagbar i:nth-child(1){background:#0b2a6f}
.flagbar i:nth-child(2){background:#fff}
.flagbar i:nth-child(3){background:#d6202f}
.hdr-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:9px;cursor:pointer}
.brand .cocarde{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#d6202f 0 28%,#fff 28% 60%,#0b2a6f 60%);box-shadow:0 0 0 1.5px var(--line)}
.hdr-sp{flex:1}
.pill{font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--surf2);color:var(--ink2)}
.iconbtn{font-size:.85rem;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--surf2);color:var(--ink)}
.iconbtn:hover{filter:brightness(.97)}

/* ===== mise en page ===== */
#app{max-width:1120px;margin:0 auto;padding:18px 16px 56px}
.scr{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rouge)}
.lead{font-size:1.08rem;color:var(--ink2);max-width:60ch}
.muted{color:var(--ink2)}
.stack>*+*{margin-top:14px}
.center{text-align:center}
.mt{margin-top:22px}

/* ===== boutons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:700;background:var(--btn2);color:var(--btn2ink);box-shadow:var(--shadow2);border:1px solid var(--line);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:linear-gradient(180deg,#e12a39,#c4182a);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(214,32,47,.38)}
.btn.big{padding:15px 28px;font-size:1.05rem}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ===== accueil ===== */
.hero{display:grid;gap:28px;align-items:center;padding:12px 0 6px}
@media(min-width:900px){.hero{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(2.6rem,8vw,4.8rem);font-weight:900}
.hero h1 em{color:var(--rouge);font-style:italic}
.hero h1::after{content:"";display:block;height:9px;width:150px;margin-top:16px;border-radius:99px;background:linear-gradient(90deg,#0b2a6f 0 33.3%,#fff 33.3% 66.6%,#d6202f 66.6%);box-shadow:0 0 0 1.5px var(--line)}
.fan{position:relative;height:330px;max-width:420px;margin:0 auto;width:100%}
.fan .pc{position:absolute;width:210px;left:50%;top:10px;margin-left:-105px;transform-origin:50% 120%;animation:fanin .9s cubic-bezier(.2,.8,.2,1) both}
.fan .pc:nth-child(1){transform:rotate(-13deg) translateX(-62px)}
.fan .pc:nth-child(2){transform:rotate(0) translateY(-10px);z-index:2;animation-delay:.1s}
.fan .pc:nth-child(3){transform:rotate(13deg) translateX(62px);animation-delay:.2s}
@keyframes fanin{from{opacity:0;transform:translateY(40px) rotate(0)}}
.steps{display:grid;gap:12px;margin-top:30px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.step{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px 16px 18px;box-shadow:var(--shadow2)}
.step b{font-family:var(--serif);font-size:2rem;color:var(--rouge);display:block;line-height:1}
.step h3{font-size:1.1rem;margin:6px 0 4px}
.step p{font-size:.92rem;color:var(--ink2)}
.fine{font-size:.82rem;color:var(--ink2);margin-top:18px}

/* ===== formulaires ===== */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow2)}
.panel h2{font-size:1.5rem;margin-bottom:4px}
.lbl{display:block;font-weight:700;font-size:.9rem;margin:18px 0 8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 16px;border-radius:12px;background:var(--surf2);font-weight:700;border:2px solid transparent;color:var(--ink)}
.seg button.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
:root[data-theme="dark"] .seg button.on{background:#e8eefc;color:#06133a;border-color:#e8eefc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{background:#e8eefc;color:#06133a;border-color:#e8eefc}}
.names{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.field{display:flex;align-items:center;gap:10px;background:var(--surf2);border-radius:14px;padding:6px 12px}
.field span{font-weight:800;color:var(--rouge);font-family:var(--serif)}
.field input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:8px 0;outline:none}
.hint{font-size:.85rem;color:var(--ink2);margin-top:6px}

/* ===== cartes ===== */
.pc{--c1:#2147a6;--c2:#0b2467;position:relative;display:flex;flex-direction:column;text-align:left;border-radius:20px;overflow:hidden;background:var(--surf);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.pc-top{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:11px 14px;display:flex;align-items:center;gap:10px}
.pc-top .emb{width:38px;height:38px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.pc-party{flex:1;font-weight:800;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;line-height:1.2}
.era{font-size:.66rem;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.22);letter-spacing:.04em;white-space:nowrap}
.pc-body{padding:14px 16px 14px;display:flex;flex-direction:column;gap:5px}
.mono{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:1.25rem;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 0 3px var(--surf),0 0 0 5px var(--c1);margin-bottom:6px}
.pc h3{font-size:1.4rem}
.role{font-size:.85rem;color:var(--ink2);font-weight:600}
.tag{font-style:italic;font-family:var(--serif);color:var(--ink2);font-size:.95rem}
.sig{margin-top:8px;font-size:.88rem;background:var(--surf2);border-left:4px solid var(--c1);border-radius:8px;padding:8px 10px}
.sig b{display:block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--c1);margin-bottom:2px}
:root[data-theme="dark"] .sig b{color:#fff;opacity:.75}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sig b{color:#fff;opacity:.75}}
.pc::after{content:"";display:block;height:7px;margin-top:auto;background:linear-gradient(90deg,#0b2a6f 0 33.4%,#fff 33.4% 66.7%,#d6202f 66.7%)}
.pc.mini .pc-body{padding:12px 14px}
.pc.mini h3{font-size:1.15rem}
.pc.mini .sig{display:none}
.pc.click{cursor:pointer;transition:transform .18s,box-shadow .18s}
.pc.click:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(8,22,60,.22)}

/* ===== duels ===== */
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.dhead h2{font-size:clamp(1.8rem,5vw,2.8rem)}
.pips{display:flex;gap:5px;margin:8px 0 18px}
.pips i{flex:1;height:7px;border-radius:99px;background:var(--surf2)}
.pips i.d{background:linear-gradient(90deg,#0b2a6f,#d6202f)}
.pips i.n{background:var(--rouge);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.duel{display:grid;gap:10px;position:relative;grid-template-columns:1fr}
@media(min-width:780px){.duel{grid-template-columns:1fr 64px 1fr;gap:0;align-items:stretch}}
.duel .pc{width:100%;padding:0;border:2px solid var(--line);transition:transform .25s,opacity .25s,box-shadow .25s}
.duel .pc.big-click{cursor:pointer}
.duel .pc.big-click:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(8,22,60,.25)}
.duel .pc .pc-body{flex:1}
.vs{display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-style:italic;font-size:1.4rem;color:#fff;background:var(--rouge);width:48px;height:48px;border-radius:50%;margin:-4px auto;position:relative;z-index:3;box-shadow:0 6px 16px rgba(214,32,47,.45)}
@media(min-width:780px){.vs{align-self:center;margin:0 auto}}
.duel .pc.won{transform:scale(1.02);border-color:var(--rouge);box-shadow:0 0 0 4px rgba(214,32,47,.25),var(--shadow)}
.duel .pc.lost{opacity:.35;transform:scale(.97)}
.choose{font-size:.8rem;color:var(--ink2);text-align:center;margin-top:12px}

/* ===== carte finale ===== */
.reveal{display:grid;gap:22px;align-items:start}
@media(min-width:860px){.reveal{grid-template-columns:minmax(320px,430px) 1fr}}
.pc.big{max-width:440px;width:100%;margin:0 auto;animation:flip .9s cubic-bezier(.2,.8,.2,1) both;position:relative}
.pc.big h3{font-size:2rem}
.pc.big .mono{width:72px;height:72px;font-size:1.7rem}
.pc.big::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 48%,transparent 66%);transform:translateX(-120%);animation:sheen 2.4s .7s ease-out forwards;pointer-events:none;z-index:2}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateY(90deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes sheen{to{transform:translateX(120%)}}
.ideas{display:grid;gap:8px;margin-top:8px}
.idea{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.idea .ic{font-size:1.3rem;line-height:1.3}
.idea b{display:block;font-size:.95rem}
.idea span{font-size:.85rem;color:var(--ink2)}

/* ===== passer le téléphone ===== */
.pass{min-height:62vh;display:grid;place-items:center;text-align:center}
.pass .box{max-width:520px}
.pass .bubble{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;font-size:2.4rem;background:linear-gradient(135deg,#0b2a6f,#d6202f);box-shadow:0 12px 30px rgba(11,42,111,.4);animation:float 2.8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.pass h2{font-size:clamp(2rem,6vw,3rem);margin-bottom:10px}
.pass h2 em{color:var(--rouge)}

/* ===== sujet ===== */
.theme-hero{background:linear-gradient(135deg,#0b2a6f,#08184a 60%,#6d0f1b);color:#fff;border-radius:26px;padding:26px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.theme-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
.theme-hero .ico{font-size:2.6rem}
.theme-hero h2{font-size:clamp(1.6rem,4.6vw,2.5rem);margin:8px 0 10px}
.theme-hero p{color:rgba(255,255,255,.86);max-width:75ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff}
.chip.d{background:var(--surf2);border-color:var(--line);color:var(--ink)}

/* ===== débat ===== */
.board{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));margin-top:14px}
.dc{--c1:#2147a6;--c2:#0b2467;position:relative;background:var(--surf);border:2px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow2);transition:transform .2s,box-shadow .2s,border-color .2s}
.dc-top{display:flex;align-items:center;gap:10px;padding:9px 12px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.dc-top .emb{width:30px;height:30px;flex:none}
.dc-top b{font-family:var(--serif);font-size:1.05rem;line-height:1.1}
.dc-top small{display:block;opacity:.85;font-size:.72rem;font-weight:600}
.dc-who{margin-left:auto;font-weight:800;font-size:.72rem;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:99px;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.dc-body{padding:12px 14px 14px}
.dc-body h4{font-family:var(--serif);font-size:1.08rem;line-height:1.2;margin-bottom:5px}
.dc-body p{font-size:.88rem;color:var(--ink2)}
.joker{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#f3c64a;color:#4a3300;border-radius:99px;padding:2px 9px;margin-bottom:6px}
.dc.speaking{transform:scale(1.015);border-color:var(--rouge);box-shadow:0 0 0 4px rgba(214,32,47,.22),var(--shadow)}
.dc.target{border-color:#4a7be0;box-shadow:0 0 0 4px rgba(74,123,224,.22),var(--shadow2)}
.dc .tg{display:block;text-align:right;margin-top:8px;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.dc.speaking .tg{color:var(--rouge)}
.dc.target .tg{color:#4a7be0}
.dock{position:sticky;bottom:0;z-index:40;margin:18px -16px -56px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--hd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(8,22,60,.12)}
.dock-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring{position:relative;width:96px;height:96px;flex:none;cursor:pointer}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--surf2)}
.ring .fg{stroke:var(--bleu);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
:root[data-theme="dark"] .ring .fg{stroke:#8db0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ring .fg{stroke:#8db0ff}}
.dock.run .ring .fg{stroke:var(--rouge)}
.dock.done .ring .fg{stroke:var(--rouge)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-weight:800;font-size:1.55rem;line-height:1}
.ring .num small{display:block;font-family:var(--sans);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin-top:3px}
.dock.done .ring .num{color:var(--rouge);animation:pulse .8s 3}
.dock-txt{flex:1;min-width:210px}
.dock-txt .st{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--rouge)}
.dock-txt .who{font-family:var(--serif);font-size:1.3rem;font-weight:800;line-height:1.15}
.dock-txt .h{font-size:.85rem;color:var(--ink2)}
.dock .row{gap:8px}
.dock .btn{padding:10px 16px}

/* ===== vote / résultats ===== */
.vlist{display:grid;gap:10px;margin-top:14px}
.vopt{--c1:#2147a6;--c2:#0b2467;display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow2);transition:transform .15s,border-color .15s}
.vopt:hover{transform:translateY(-2px)}
.vopt.on{border-color:var(--rouge);box-shadow:0 0 0 4px rgba(214,32,47,.2)}
.vopt .mono{margin:0;width:46px;height:46px;font-size:1.05rem;flex:none}
.vopt b{font-family:var(--serif);font-size:1.12rem;display:block}
.vopt span{font-size:.85rem;color:var(--ink2)}
.vopt .ck{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.9rem;color:#fff}
.vopt.on .ck{background:var(--rouge);border-color:var(--rouge)}
.podium{display:grid;gap:12px;margin-top:16px}
.prow{--c1:#2147a6;--c2:#0b2467;position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surf);border:2px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow2);overflow:hidden}
.prow.win{border-color:#e0a81f;background:linear-gradient(135deg,var(--surf),rgba(240,196,60,.16))}
.prow .rank{font-family:var(--serif);font-weight:900;font-size:1.9rem;width:42px;text-align:center;color:var(--ink2)}
.prow.win .rank{color:#d49a0b}
.prow .nm{font-family:var(--serif);font-weight:800;font-size:1.2rem;line-height:1.15}
.prow .cn{font-size:.85rem;color:var(--ink2)}
.bar{height:9px;border-radius:99px;background:var(--surf2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2));transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.prow .sc{font-family:var(--serif);font-weight:900;font-size:1.8rem;text-align:right;line-height:1}

.crown{position:absolute;right:8px;top:-2px;font-size:1.3rem}
.fact{margin-top:20px;background:var(--surf2);border-left:5px solid var(--rouge);border-radius:12px;padding:14px 16px;font-size:.95rem}
.fact b{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--rouge);margin-bottom:3px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
.confetti i{position:absolute;top:-20px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ===== galerie ===== */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.filters button{padding:7px 13px;border-radius:99px;background:var(--surf2);font-weight:700;font-size:.82rem;border:2px solid transparent;color:var(--ink)}
.filters button.on{background:var(--bleu);color:#fff}
:root[data-theme="dark"] .filters button.on{background:#e8eefc;color:#06133a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .filters button.on{background:#e8eefc;color:#06133a}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:14px}
.grid .pc.mini .sig{display:block}

/* ===== modale ===== */
.modal{position:fixed;inset:0;z-index:90;background:rgba(3,10,30,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surf);color:var(--ink);border-radius:24px;max-width:640px;width:100%;max-height:100%;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.5);border:1px solid var(--line);animation:rise .3s both}
.sheet h2{font-size:1.6rem;margin-bottom:8px}
.sheet ol,.sheet ul{padding-left:20px;display:grid;gap:8px;margin:10px 0}
.sheet .x{float:right;margin:-6px -6px 0 8px}
.dline{display:flex;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.dline .ic{font-size:1.4rem}
.dline b{display:block;font-family:var(--serif);font-size:1.02rem}
.dline p{font-size:.88rem;color:var(--ink2)}
.dline .tn{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rouge)}
@media(max-width:520px){
  .dock-in{gap:12px}
  .ring{width:84px;height:84px}
  .dock-txt{min-width:0;flex-basis:calc(100% - 100px)}
}

.bio{font-size:.86rem;color:var(--ink2);margin-top:2px}
.duel .pc .bio{font-size:.9rem}

#app{overflow-x:clip}
@media(max-width:520px){
  .fan .pc:nth-child(1){transform:rotate(-12deg) translateX(-34px)}
  .fan .pc:nth-child(3){transform:rotate(12deg) translateX(34px)}

.brand{white-space:nowrap;flex:none}

.pill{white-space:nowrap}

#conn{position:fixed;left:0;right:0;top:calc(66px + env(safe-area-inset-top,0px));z-index:70;background:#b4161f;color:#fff;text-align:center;font-weight:700;font-size:.85rem;padding:7px 12px;display:none}

.dc.mine{box-shadow:0 0 0 3px #f3c64a,var(--shadow2)}

    def: ["Dire non à la guerre en Irak", "En février-mars 2003, la France, portée à l’ONU par Dominique de Villepin, refuse de soutenir l’intervention américaine en Irak sans mandat du Conseil de sécurité."],
    alg: ["Revenir sur la « colonisation positive »", "En 2005, une loi évoquait le « rôle positif » de la présence française outre-mer. Après la polémique, Chirac fait supprimer ce passage en janvier 2006. En 2003, il avait proposé à Alger un traité d’amitié, jamais signé."],
    soc: ["Interdire les signes religieux ostensibles à l’école", "Après la commission Stasi, la loi du 15 mars 2004 interdit les signes manifestant ostensiblement une appartenance religieuse dans les écoles, collèges et lycées publics."],
    ins: ["Le quinquennat", "Avec Lionel Jospin, il fait adopter par référendum (24 septembre 2000) le passage du septennat au quinquennat, avec une faible participation (environ 30 %)."],
    eur: ["Soumettre la Constitution européenne aux Français", "Il organise le référendum de mai 2005 sur le traité constitutionnel européen : le « non » l’emporte avec 54,7 %."],
    nuc: ["Dernière série d’essais, puis arrêt définitif", "En 1995-96, il reprend une série d’essais nucléaires à Mururoa, puis annonce l’arrêt définitif et signe le traité d’interdiction complète des essais."],
    eco: ["Privatiser et supprimer l’impôt sur la fortune", "Premier ministre de cohabitation (1986-1988), il lance une vaste vague de privatisations et supprime l’impôt sur les grandes fortunes."],
    ret: ["La réforme Fillon de 2003", "Son gouvernement aligne la durée de cotisation des fonctionnaires sur celle du privé (40 ans) et prévoit son allongement progressif avec l’espérance de vie."]
  } },
{ id: "sarkozy", nom: "Nicolas Sarkozy", role: "Président de la République", an: "2007-2012", era: "h", pt: "lr", pl: "UMP · Les Républicains", tag: "L’hyperprésident",
  bio: "Hyperactif et volontariste : la « rupture » et le slogan « travailler plus pour gagner plus ».",
  s: {
    ret: ["La retraite à 62 ans", "En 2010, malgré d’importantes manifestations, il fait voter le report de l’âge légal de 60 à 62 ans (et de 65 à 67 ans pour le taux plein)."],
    soc: ["Interdire la dissimulation du visage", "La loi d’octobre 2010 interdit de se couvrir le visage dans l’espace public (burqa, niqab). La Cour européenne des droits de l’homme l’a validée en 2014."],
    def: ["Réintégrer le commandement de l’OTAN", "En 2009, il ramène la France dans le commandement militaire intégré, que de Gaulle avait quitté en 1966, en conservant l’indépendance de la dissuasion nucléaire."],
    eco: ["Travailler plus pour gagner plus", "La loi TEPA (août 2007) défiscalise les heures supplémentaires et plafonne les impôts avec un bouclier fiscal à 50 %."],
    alg: ["Reconnaître l’injustice coloniale, refuser la repentance", "À Constantine (décembre 2007), il juge le système colonial injuste, mais il refuse les excuses officielles et la « repentance »."],
    eur: ["Le traité de Lisbonne par la voie parlementaire", "Après le « non » de 2005, il fait ratifier le traité de Lisbonne par le Parlement réuni en Congrès (février 2008), sans nouveau référendum."],
    sec: ["Les peines planchers", "La loi d’août 2007 instaure des peines minimales pour les récidivistes. Elles seront supprimées en 2014."],
    imm: ["L’immigration choisie", "La loi de juillet 2006, portée par Nicolas Sarkozy alors ministre de l’Intérieur, durcit le regroupement familial et crée la carte « compétences et talents »."],
    ins: ["La réforme constitutionnelle de 2008", "Elle permet au président de s’exprimer devant le Parlement à Versailles, limite à deux les mandats présidentiels consécutifs et crée la question prioritaire de constitutionnalité."]
  } },
{ id: "hollande", nom: "François Hollande", role: "Président de la République", an: "2012-2017", era: "h", pt: "ps", pl: "Parti socialiste", tag: "Le président normal",
  bio: "Mariage pour tous, accord de Paris sur le climat… mais un quinquennat marqué par les attentats de 2015.",
  s: {
    soc: ["Ouvrir le mariage aux couples de même sexe", "La loi Taubira du 17 mai 2013 ouvre le mariage et l’adoption aux couples de même sexe, après un débat très vif dans la société."],
    nuc: ["Ramener le nucléaire à 50 % de l’électricité", "Engagement de 2012, repris dans la loi de transition énergétique de 2015 : plafonner la part du nucléaire à 50 % (objectif repoussé ensuite) et fermer Fessenheim, arrêtée en 2020."],
    alg: ["Reconnaître la répression du 17 octobre 1961", "En 2012, il reconnaît la sanglante répression d’octobre 1961 à Paris contre des Algériens et, à Alger en décembre 2012, évoque un système colonial « injuste et brutal »."],
    eco: ["Taxer à 75 % les très hauts revenus", "Promise en 2012, la contribution exceptionnelle de 75 % sur la part des revenus d’activité au-delà d’un million d’euros s’applique en 2013-2014, avant d’être abandonnée."],
    ret: ["La retraite à 60 ans pour les carrières longues", "En 2012, un décret permet de partir à 60 ans à ceux qui ont commencé à travailler très tôt. Mais la durée de cotisation s’allonge peu à peu (réforme de 2014)."],
    sec: ["La déchéance de nationalité pour terroristes", "Après les attentats du 13 novembre 2015, il propose d’inscrire l’état d’urgence dans la Constitution et la déchéance de nationalité pour les binationaux condamnés pour terrorisme. Le projet est abandonné en mars 2016."],
    eur: ["Renégocier le pacte budgétaire européen", "Candidat, il promet de renégocier le traité budgétaire. Il obtient en juin 2012 un « pacte pour la croissance et l’emploi » de 120 milliards d’euros."],
    def: ["Intervenir au Mali (opération Serval)", "En janvier 2013, il lance l’opération Serval pour stopper l’avancée de groupes djihadistes vers Bamako."]
  } },
{ id: "rocard", nom: "Michel Rocard", role: "Premier ministre", an: "1988-1991", era: "h", pt: "ps", pl: "Parti socialiste", tag: "La deuxième gauche",
  bio: "Réformiste et pragmatique, il incarne une gauche de compromis, attachée à la négociation.",
  s: {
    eco: ["Créer le RMI et la CSG", "En 1988, il fait voter le revenu minimum d’insertion, dernier filet de sécurité pour les plus précaires. En 1990, la CSG élargit le financement de la protection sociale à l’ensemble des revenus."],
    ret: ["Le Livre blanc sur les retraites", "En 1991, il publie un Livre blanc qui alerte sur le financement des retraites et ouvre le débat sur l’allongement de la durée de cotisation."],
    imm: ["Prendre « sa part » de la misère du monde", "En 1989, il affirme que la France ne peut pas accueillir toute la misère du monde, mais qu’elle doit en prendre fidèlement sa part."],
    ins: ["Les accords de Matignon sur la Nouvelle-Calédonie", "En 1988, après les violences en Nouvelle-Calédonie, il fait dialoguer indépendantistes et loyalistes : les accords de Matignon prévoient un référendum d’autodétermination dix ans plus tard."]
  } },
{ id: "jospin", nom: "Lionel Jospin", role: "Premier ministre", an: "1997-2002", era: "h", pt: "ps", pl: "Parti socialiste", tag: "La gauche plurielle",
  bio: "Premier ministre de cohabitation sous Jacques Chirac, éliminé dès le premier tour de la présidentielle de 2002.",
  s: {
    eco: ["Les 35 heures", "Les lois Aubry (1998 et 2000) abaissent la durée légale du travail de 39 à 35 heures par semaine, avec l’objectif de créer des emplois."],
    soc: ["Le PACS", "La loi de novembre 1999 crée le pacte civil de solidarité, ouvert aux couples de même sexe comme de sexe différent, après un débat parlementaire houleux."],
    nuc: ["Arrêter Superphénix", "En 1997, son gouvernement décide l’arrêt définitif du surgénérateur Superphénix de Creys-Malville, conformément à l’accord de gouvernement avec les Verts."],
    imm: ["Régulariser et réformer le droit des étrangers", "En 1997-98, environ 80 000 sans-papiers sont régularisés ; la loi Chevènement de 1998 refonde le droit d’entrée et de séjour des étrangers."],
    sec: ["Faire de la sécurité une priorité de gauche", "Au colloque de Villepinte (octobre 1997), son gouvernement place la sécurité au rang de priorité : police de proximité, contrats locaux de sécurité."],
    alg: ["Reconnaître la « guerre d’Algérie »", "La loi de 1999, adoptée sous son gouvernement, remplace enfin l’expression « opérations de maintien de l’ordre en Afrique du Nord » par « guerre d’Algérie »."],
    ins: ["Le quinquennat et l’inversion du calendrier", "Avec Jacques Chirac, il fait adopter le quinquennat (2000), puis place les législatives juste après la présidentielle (2001) pour donner une majorité au président élu."],
    eur: ["Entrer dans l’euro, avec un volet emploi", "En 1997, au sommet d’Amsterdam, il obtient que le pacte de stabilité soit complété par une résolution sur la croissance et l’emploi. La France entre dans l’euro en 1999."]
  } },
{ id: "veil", nom: "Simone Veil", role: "Ministre de la Santé", an: "1974-1979", era: "h", pt: "udf", pl: "Centre · UDF", tag: "La loi Veil",
  bio: "Rescapée d’Auschwitz, ministre de la Santé de Giscard, première présidente du Parlement européen élu.",
  s: {
    soc: ["La légalisation de l’IVG", "Le 26 novembre 1974, elle défend devant l’Assemblée le projet de loi sur l’interruption volontaire de grossesse, adopté en janvier 1975 (loi du 17 janvier 1975) grâce aux voix de la gauche et d’une partie de la droite."],
    eur: ["Présider le premier Parlement européen élu", "Elle devient en 1979 la première présidente du Parlement européen élu au suffrage universel direct, fonction qu’elle exerce jusqu’en 1982."]
  } },
{ id: "badinter", nom: "Robert Badinter", role: "Garde des Sceaux", an: "1981-1986", era: "h", pt: "ps", pl: "Parti socialiste", tag: "L’abolitionniste",
  bio: "Avocat, ministre de la Justice de Mitterrand, puis président du Conseil constitutionnel (1986-1995).",
  s: {
    sec: ["Abolir la peine de mort", "Le 17 septembre 1981, il plaide devant l’Assemblée pour l’abolition : la justice d’un État de droit ne doit pas donner la mort. La loi est promulguée le 9 octobre 1981."],
    soc: ["Dépénaliser l’homosexualité", "En 1982, il fait voter la fin de la discrimination pénale en alignant l’âge de la majorité sexuelle, quelle que soit l’orientation."],
    ins: ["Un Conseil constitutionnel gardien des libertés", "Président de 1986 à 1995, il fait de l’institution un véritable juge des droits fondamentaux, capable de censurer la loi."]
  } },
{ id: "debre", nom: "Michel Debré", role: "Premier ministre", an: "1959-1962", era: "h", pt: "gaul", pl: "UNR · gaullisme", tag: "Le père de la Constitution",
  bio: "Premier chef de gouvernement de la Ve République, il en a rédigé la Constitution avec le général de Gaulle.",
  s: {
    ins: ["Écrire la Constitution de 1958", "Garde des Sceaux, il pilote la rédaction de la Constitution de la Ve République : un exécutif fort et un parlementarisme « rationalisé »."],
    soc: ["La loi Debré sur l’école privée", "En 1959, elle permet à l’État de passer des contrats avec les établissements privés, qui doivent en échange respecter les programmes et accueillir tous les élèves."],
    alg: ["Défendre l’Algérie française, mais servir le Général", "Partisan de l’Algérie française, il reste pourtant Premier ministre pendant l’autodétermination (1959) et les négociations, jusqu’à avril 1962."]
  } },
{ id: "marchais", nom: "Georges Marchais", role: "Secrétaire général du PCF", an: "1972-1994", era: "h", pt: "pcf", pl: "Parti communiste", tag: "Le tribun",
  bio: "Chef du PCF pendant plus de vingt ans, candidat à la présidentielle de 1981.",
  s: {
    ret: ["La retraite à 60 ans", "Le Programme commun de la gauche (1972), dont le PCF est signataire, inscrit la retraite à 60 ans. Marchais en fait un axe central de sa campagne."],
    nuc: ["Le nucléaire civil et militaire", "Le PCF défend la dissuasion et le programme nucléaire d’EDF, présentés comme des atouts d’indépendance et d’emploi."],
    eco: ["Nationaliser les grands groupes", "Le PCF veut nationaliser les grands groupes industriels et bancaires (Programme commun, 1972), une mesure en partie appliquée en 1981-82."],
    eur: ["Produire français", "Le PCF de Marchais critique une Europe supranationale jugée au service du patronat et défend un « produisons français » dans les années 1980."],
    imm: ["Arrêter l’immigration nouvelle", "En 1980-81, le PCF réclame l’arrêt de l’immigration de travail pour protéger l’emploi et le logement, une position qui contraste avec celle de la gauche actuelle."]
  } },
{ id: "jmlepen", nom: "Jean-Marie Le Pen", role: "Président du Front national", an: "1972-2011", era: "h", pt: "fn", pl: "Front national", tag: "Le Menhir",
  bio: "Fondateur du Front national, qualifié au second tour de la présidentielle de 2002.",
  s: {
    imm: ["La préférence nationale", "Dans les années 1980, le FN fait de la « préférence nationale » son idée centrale : priorité aux Français pour l’emploi, le logement et certaines aides."],
    sec: ["Rétablir la peine de mort", "Il réclame le rétablissement de la peine de mort, abolie en 1981, et un durcissement général de la politique pénale."],
    alg: ["Défendre l’Algérie française", "Député en 1956, il part en 1957 comme lieutenant en Algérie. Il restera un défenseur de l’Algérie française."],
    eur: ["Dire non à Maastricht", "Le FN appelle à voter « non » au référendum de 1992 sur le traité de Maastricht et prône une Europe des nations."],
    ins: ["Le scrutin proportionnel", "Le FN réclame le scrutin proportionnel. En 1986, grâce à la proportionnelle instaurée par François Mitterrand, il envoie 35 députés à l’Assemblée."]
  } },
{ id: "balladur", nom: "Édouard Balladur", role: "Premier ministre", an: "1993-1995", era: "h", pt: "gaul", pl: "RPR", tag: "Le Premier ministre de la cohabitation",
  bio: "Ministre de l’Économie (1986-1988), puis Premier ministre de cohabitation sous François Mitterrand.",
  s: {
    ret: ["La réforme des retraites du privé", "En 1993, il porte de 37,5 à 40 ans la durée de cotisation du régime général et calcule la pension sur les 25 meilleures années."],
    eco: ["Privatiser", "Sous ses gouvernements (1986-1988, 1993-1995), de grandes entreprises publiques sont privatisées, dont BNP, Rhône-Poulenc et Elf."],
    imm: ["Réformer le Code de la nationalité", "La loi de 1993 soumet la nationalité des enfants nés en France de parents étrangers à une démarche volontaire, condition supprimée en 1998."]
  } },
{ id: "seguin", nom: "Philippe Séguin", role: "Président de l’Assemblée nationale", an: "1993-1997", era: "h", pt: "gaul", pl: "RPR", tag: "Le gaulliste social",
  bio: "Grand orateur, gaulliste social et souverainiste, l’un des principaux opposants à Maastricht.",
  s: {
    eur: ["Dire non à Maastricht", "Le 5 mai 1992, il prononce à l’Assemblée un grand discours contre le traité de Maastricht, au nom de la souveraineté populaire, et fait campagne pour le « non »."],
    ins: ["La session parlementaire unique", "Président de l’Assemblée, il porte la révision de 1995 qui instaure une session ordinaire unique, pour renforcer le travail du Parlement."]
  } },
{ id: "pasqua", nom: "Charles Pasqua", role: "Ministre de l’Intérieur", an: "1986-1988 · 1993-1995", era: "h", pt: "gaul", pl: "RPR", tag: "Le Corse de la Ve",
  bio: "Gaulliste de combat, deux fois ministre de l’Intérieur, associé à une politique ferme sur l’immigration.",
  s: {
    imm: ["« Immigration zéro »", "Il fait voter les lois Pasqua de 1986 et 1993, qui durcissent les conditions d’entrée et de séjour des étrangers, au nom d’une « immigration zéro »."],
    sec: ["« Terroriser les terroristes »", "Face aux attentats de 1986, il durcit la législation antiterroriste (loi du 9 septembre 1986) et affiche sa volonté de « terroriser les terroristes »."],
    eur: ["Non à Maastricht, pour l’Europe des patries", "En 1992, il fait campagne avec Philippe Séguin contre le traité de Maastricht, au nom de la souveraineté nationale."]
  } },
{ id: "chevenement", nom: "Jean-Pierre Chevènement", role: "Ministre de la Défense", an: "1988-1991", era: "h", pt: "ps", pl: "PS puis MDC", tag: "Le républicain",
  bio: "Ministre de l’Éducation, de la Défense puis de l’Intérieur, candidat souverainiste en 2002.",
  s: {
    def: ["Dire non à la guerre du Golfe", "Ministre de la Défense, il démissionne en janvier 1991 pour protester contre l’engagement français dans la guerre du Golfe."],
    eur: ["Non à Maastricht, pour la souveraineté", "En 1992, il fait campagne pour le « non » au traité de Maastricht, au nom de la souveraineté nationale."],
    soc: ["80 % d’une classe d’âge au niveau du bac", "Ministre de l’Éducation (1984-1986), il fixe l’objectif de conduire 80 % d’une classe d’âge au niveau du baccalauréat et crée le bac professionnel."],
    imm: ["La loi Chevènement sur le séjour des étrangers", "La loi de 1998 refonde le droit d’entrée et de séjour des étrangers : elle crée l’asile territorial et un titre de séjour pour les liens personnels et familiaux."]
  } },
{ id: "mauroy", nom: "Pierre Mauroy", role: "Premier ministre", an: "1981-1984", era: "h", pt: "ps", pl: "Parti socialiste", tag: "La gauche de rupture",
  bio: "Maire de Lille, premier Premier ministre de François Mitterrand en 1981.",
  s: {
    eco: ["Cinq semaines de congés et 39 heures", "Dès 1982, les congés payés passent à cinq semaines et la durée légale du travail de 40 à 39 heures, sans baisse de salaire."],
    ret: ["La retraite à 60 ans", "Premier ministre, il met en œuvre dès 1982 la retraite à 60 ans à taux plein, pour 37,5 années de cotisation."],
    ins: ["La décentralisation", "Avec Gaston Defferre, les lois de 1982-1983 transfèrent de larges compétences de l’État aux communes, départements et régions, et suppriment la tutelle a priori du préfet."]
  } },

{ id: "macron", nom: "Emmanuel Macron", role: "Président de la République", an: "depuis 2017", era: "a", pt: "ren", pl: "Renaissance", tag: "Le « en même temps »",
  bio: "Réélu en 2022, il ne peut pas se représenter en 2027. Réformes libérales, Europe, souveraineté.",
  s: {
    ret: ["La retraite à 64 ans", "La réforme de 2023 relève progressivement l’âge légal de 62 à 64 ans. Adoptée avec l’article 49.3 après des mois de mobilisation, elle est aujourd’hui suspendue."],
    nuc: ["Relancer le nucléaire : six EPR2", "À Belfort, en février 2022, il annonce six nouveaux réacteurs EPR2 (huit en option), la prolongation des centrales existantes et l’arrêt des fermetures prévues."],
    def: ["La dissuasion « avancée » européenne", "Le 2 mars 2026 à l’Île Longue, il propose d’associer des partenaires européens à la dissuasion française, tout en gardant la décision exclusivement française, et annonce une hausse du nombre de têtes sans en donner le chiffre."],
    alg: ["« Un crime contre l’humanité »", "En 2017, à Alger, il qualifie la colonisation de crime contre l’humanité. Il reconnaît ensuite la responsabilité de l’État dans la mort de Maurice Audin (2018) et commande le rapport Stora (2021) sur la mémoire de la guerre d’Algérie."],
    eur: ["Une Europe souveraine", "Dans ses discours de la Sorbonne (2017, puis 2024), il plaide pour une Europe puissante, avec une défense plus intégrée, une préférence européenne et un budget propre à la zone euro."],
    eco: ["Supprimer l’ISF, instaurer la flat tax", "En 2018, l’ISF est remplacé par l’impôt sur la fortune immobilière et un prélèvement forfaitaire de 30 % sur les revenus du capital, pour encourager l’investissement."],
    imm: ["La loi immigration de 2024", "Promulguée en janvier 2024 : conditions de séjour et d’accès aux prestations durcies, régularisation possible dans les métiers en tension. Plusieurs articles sont censurés par le Conseil constitutionnel."],
    soc: ["La loi contre les séparatismes", "La loi d’août 2021 « confortant le respect des principes de la République » renforce le contrôle des associations et lutte contre les discours de haine en ligne."],
    ins: ["Dissoudre pour trancher", "Après les européennes de 2024, il dissout l’Assemblée nationale (9 juin 2024). Les législatives donnent une assemblée sans majorité."]
  } },
{ id: "lecornu", nom: "Sébastien Lecornu", role: "Premier ministre", an: "depuis 2025", era: "a", pt: "ren", pl: "Renaissance", tag: "Le Premier ministre du compromis",
  bio: "Ancien ministre des Armées (2022-2025), issu de la droite, nommé à Matignon en septembre 2025.",
  s: {

    def: ["Moderniser les armées", "Ministre des Armées de 2022 à 2025, il porte la loi de programmation militaire 2024-2030, dotée de 413 milliards d’euros."],
    ret: ["Suspendre la réforme des retraites", "En octobre 2025, il annonce la suspension de la réforme de 2023 pour obtenir la non-censure des socialistes, le temps de nouvelles discussions."],

    eco: ["Justice fiscale, sans taxer le patrimoine professionnel", "Prêt à discuter de justice fiscale, il demande de faire attention au patrimoine professionnel, qui permet de créer des emplois, et annonce un budget 2027 sans hausse d’impôts par rapport à 2026."]
  } },
{ id: "mlepen", nom: "Marine Le Pen", role: "Présidente du groupe RN à l’Assemblée", an: "candidate 2027", era: "a", pt: "rn", pl: "Rassemblement national", tag: "La candidate de la quatrième fois",

  s: {

    nuc: ["Un parc nucléaire massivement développé", "Le RN veut relancer la filière nucléaire (de nouveaux EPR), arrêter les projets éoliens et revenir sur le marché européen de l’électricité."],

    ins: ["La proportionnelle et le RIC", "Marine Le Pen défend de longue date le scrutin proportionnel aux législatives et le référendum d’initiative citoyenne."],
    soc: ["Interdire le voile islamique dans l’espace public", "Elle propose d’interdire par la loi le port du voile islamique dans l’espace public, mesure que ses adversaires jugent contraire à la liberté de conscience."]
  } },
{ id: "bardella", nom: "Jordan Bardella", role: "Président du RN", an: "depuis 2022", era: "a", pt: "rn", pl: "Rassemblement national", tag: "Le plus jeune président de parti",

/* ============ OUTILS ============ */
const $ = s => document.querySelector(s);
const NB = "\u00a0";
const fr = s => String(s).replace(/« /g, "«" + NB).replace(/ »/g, NB + "»").replace(/ ([:;?!])/g, NB + "$1");
const esc = s => fr(String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"));
const attr = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const byId = id => CANDS.find(c => c.id === id);
const initials = n => {
  const w = String(n).trim().split(/\s+/).filter(x => /^[A-ZÀ-ÖØ-Þ]/.test(x));
  if (!w.length) return "?";
  const f = w[0][0], l = w.length > 1 ? w[w.length - 1][0] : "";
  return (f + l).toUpperCase();
};
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

/* ============ ÉMBLÈMES (dessins stylisés) ============ */
function starPts(cx, cy, R, r) {
  let p = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
    p.push((cx + rr * Math.cos(a)).toFixed(1) + "," + (cy + rr * Math.sin(a)).toFixed(1));
  }
  return p.join(" ");
}
function emblem(kind, fg, bg) {
  fg = fg || "#fff"; bg = bg || "#000";
  let g = "";
  switch (kind) {
    case "lorraine":
      g = `<g stroke="${fg}" stroke-width="5.5" stroke-linecap="round" fill="none"><path d="M32 7V57M23 18H41M15 34H49"/></g>`; break;
    case "lr":
      g = `<text x="32" y="40" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="29" fill="${fg}">LR</text><rect x="12" y="46" width="13" height="4" fill="#8fb2ff"/><rect x="25.5" y="46" width="13" height="4" fill="#fff"/><rect x="39" y="46" width="13" height="4" fill="#ff6b78"/>`; break;
    case "sun": {
      let rays = "";
      for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; rays += `<line x1="${(32 + 16 * Math.cos(a)).toFixed(1)}" y1="${(32 + 16 * Math.sin(a)).toFixed(1)}" x2="${(32 + 24 * Math.cos(a)).toFixed(1)}" y2="${(32 + 24 * Math.sin(a)).toFixed(1)}"/>`; }
      g = `<circle cx="32" cy="32" r="11" fill="${fg}"/><g stroke="${fg}" stroke-width="3.5" stroke-linecap="round">${rays}</g>`; break;
    }
    case "rose":
      g = `<circle cx="32" cy="25" r="15" fill="${fg}"/><path d="M32 25m-9 0a9 9 0 1 1 9 9" fill="none" stroke="${bg}" stroke-width="3.2" stroke-linecap="round"/><path d="M32 40v18" stroke="${fg}" stroke-width="4" stroke-linecap="round"/><path d="M32 52c-9-1-12-5-13-10 8 0 12 4 13 10z" fill="${fg}"/>`; break;
    case "star":
      g = `<circle cx="32" cy="32" r="25" fill="none" stroke="${fg}" stroke-width="3"/><polygon points="${starPts(32, 33, 17, 7)}" fill="${fg}"/>`; break;
    case "phi":
      g = `<circle cx="32" cy="32" r="26" fill="none" stroke="${fg}" stroke-width="3"/><text x="32" y="45" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-weight="700" font-size="38" fill="${fg}">φ</text>`; break;
    case "flame":
      g = `<path d="M32 5C30 18 17 24 17 39c0 11 8 19 18 19 10 0 16-8 14-18-2-8-9-10-9-18-4 4-6-4-8-17z" fill="#fff"/><path d="M33 22c-1 9-9 12-9 21 0 6 4 10 10 10 7 0 10-5 9-11-1-6-7-8-7-14-3 2-3-2-3-6z" fill="#3a62d8"/><path d="M34 37c-1 4-4 5-4 9 0 4 3 6 6 6s5-3 4-6c-1-3-5-5-6-9z" fill="#e1000f"/>`; break;
    case "arrow":
      g = `<path d="M9 40L32 10l23 30H43L32 25 21 40z" fill="${fg}"/><rect x="20" y="46" width="24" height="6" rx="3" fill="${fg}"/>`; break;
    case "horizon":
      g = `<path d="M15 34a17 17 0 0 1 34 0z" fill="${fg}"/><g stroke="${fg}" stroke-width="3.2" stroke-linecap="round"><path d="M8 40h48M14 47h36M21 54h22"/></g>`; break;
    case "leaf":
      g = `<path d="M12 49C10 26 27 11 53 11c0 27-14 41-37 40z" fill="${fg}"/><path d="M15 48C26 36 36 27 47 19" stroke="${bg}" stroke-width="3" fill="none" stroke-linecap="round"/>`; break;
    case "pp":
      g = `<circle cx="24" cy="32" r="15" fill="none" stroke="${fg}" stroke-width="5"/><circle cx="40" cy="32" r="15" fill="none" stroke="${fg}" stroke-width="5"/>`; break;
    case "shield":
      g = `<path d="M32 6l21 8v17c0 14-9 22-21 27C20 53 11 45 11 31V14z" fill="${fg}"/><text x="32" y="43" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="32" fill="${bg}">R</text>`; break;
    case "laurel":
      g = `<circle cx="32" cy="32" r="25" fill="none" stroke="${fg}" stroke-width="3.5"/><text x="32" y="43" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="31" fill="${fg}">H</text>`; break;
    default:
      g = `<circle cx="32" cy="32" r="20" fill="${fg}"/>`;
  }
  return `<svg class="emb" viewBox="0 0 64 64" aria-hidden="true">${g}</svg>`;
}

/* ============ LOGIQUE : DUELS ============ */
function pickOpp(p, w) {
  const pool = CANDS.filter(c => !S.taken.has(c.id) && !p.seen.includes(c.id));
  const samePt = (a, b) => a.pt === b.pt || (a.pt === "rn" && b.pt === "fn") || (a.pt === "fn" && b.pt === "rn");
  const pref = pool.filter(c => !samePt(c, w));
  const cross = pref.filter(c => c.era !== w.era);
  const list = (Math.random() < 0.65 && cross.length) ? cross : (pref.length ? pref : pool);
  return rand(list);
}
const curP = () => S.dp || S.players[S.cur];
function startDuels(p) {
  p.seen = [];
  const pool = CANDS.filter(c => !S.taken.has(c.id));
  const a = rand(pool);
  p.seen.push(a.id);
  const b = pickOpp(p, a);
  p.seen.push(b.id);
  S.duel = Math.random() < 0.5 ? { n: 1, a: a.id, b: b.id, picked: null } : { n: 1, a: b.id, b: a.id, picked: null };
}
function pick(side) {
  const d = S.duel; if (!d || d.picked) return;
  d.picked = side;
  const w = byId(side === "a" ? d.a : d.b);
  document.querySelectorAll(".duel .pc").forEach(el => {
    el.classList.remove("won", "lost");
    el.classList.add(el.dataset.side === side ? "won" : "lost");
  });
  setTimeout(() => {
    const p = curP();
    if (d.n >= 10) {
      if (S.onFinal) { S.lastLoser = side === "a" ? d.b : d.a; S.onFinal(w); }
      else { p.cand = w.id; S.taken.add(w.id); go("card"); }
    } else {
      const o = pickOpp(p, w); p.seen.push(o.id);
      S.duel = Math.random() < 0.5 ? { n: d.n + 1, a: w.id, b: o.id, picked: null } : { n: d.n + 1, a: o.id, b: w.id, picked: null };
      render();
    }
  }, 620);
}

function jokerText(c) {
  const first = Object.values(c.s)[0];
  return `Pas de position précise de ${c.nom} sur ce sujet dans notre base. Imagine ce qu’il défendrait d’après son parcours (par exemple : « ${first[0]} ») et dis clairement que tu extrapoles.`;
}
function buildSteps(idxs) {
  const r = RYTHMES[S.rythme], nm = i => S.players[i].name;
  const o = shuffle(idxs || S.players.map((_, i) => i));
  const st = [{ k: "prep", t: "Préparation", who: null, sec: r.prep, h: "Lisez votre carte en silence : quelle est votre idée, quels sont vos meilleurs arguments ?" }];
  o.forEach(i => st.push({ k: "open", t: "Ouverture", who: [i], sec: r.open, h: "Présente ton candidat et défends ton idée." }));
  o.forEach((i, n) => {
    const j = o[(n + 1) % o.length];
    st.push({ k: "att", t: "Attaque", who: [i], tgt: j, sec: r.att, h: `Conteste l’idée de ${nm(j)}.` });
    st.push({ k: "rep", t: "Riposte", who: [j], tgt: i, sec: r.rep, h: `Réponds à ${nm(i)}.` });
  });
  o.slice().reverse().forEach(i => st.push({ k: "close", t: "Conclusion", who: [i], sec: r.close, h: "Convaincs le public avec une dernière phrase forte." }));
  return st;
}
function planRound() {
  const used = S.online ? (O.s.used || []) : S.usedThemes;
  const live = S.players.map((_, i) => i).filter(i => S.players[i].cand);
  const avail = Object.keys(THEMES).filter(k => !used.includes(k));
  const cs = live.map(i => byId(S.players[i].cand));
  const sc = avail.map(k => {
    const have = cs.filter(c => c.s[k]);
    return { k, cov: have.length, mix: new Set(have.map(c => c.era)).size > 1 ? 1 : 0, r: Math.random() };
  }).sort((a, b) => b.cov - a.cov || b.mix - a.mix || b.r - a.r);
  return { theme: sc[0].k, steps: buildSteps(live) };
}
function setupRound() {
  const r = planRound();
  S.theme = r.theme; S.usedThemes.push(S.theme);
  S.hands = S.players.map(p => { const c = byId(p.cand); const st = c.s[S.theme] || null; return { cand: c.id, st, joker: st ? null : jokerText(c) }; });
  S.steps = r.steps; S.stepIdx = 0;
  stopTimer(); setTimer(S.steps[0].sec);
}

/* ============ CHRONO ============ */
const T = { left: 0, total: 1, run: false, t0: 0, base: 0, iv: null, ctx: null };
function stopTimer() { if (T.iv) clearInterval(T.iv); T.iv = null; T.run = false; }
function setTimer(sec) { stopTimer(); T.total = sec; T.left = sec; }
function beep() {
  try {
    T.ctx = T.ctx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22, 0.44].forEach(d => {
      const o = T.ctx.createOscillator(), g = T.ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(T.ctx.destination);
      g.gain.setValueAtTime(0.0001, T.ctx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.25, T.ctx.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, T.ctx.currentTime + d + 0.18);
      o.start(T.ctx.currentTime + d); o.stop(T.ctx.currentTime + d + 0.2);
    });
  } catch (e) { }
  try { if (navigator.vibrate) navigator.vibrate([180, 80, 180]); } catch (e) { }
}
function toggleTimer() {
  if (T.left <= 0) return;
  if (T.run) { stopTimer(); }
  else {
    try { T.ctx = T.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (T.ctx.state === "suspended") T.ctx.resume(); } catch (e) { }
    T.run = true; T.t0 = Date.now(); T.base = T.left;
    T.iv = setInterval(() => {
      T.left = Math.max(0, T.base - (Date.now() - T.t0) / 1000);
      if (T.left <= 0) { stopTimer(); paintTimer(); beep(); return; }
      paintTimer();
    }, 200);
  }
  paintTimer();
}
function paintTimer() {
  const num = $("#tnum"); if (!num) return;
  num.textContent = fmt(T.left);
  $("#tring").style.strokeDashoffset = (326.7 * (1 - T.left / T.total)).toFixed(1);
  const dock = $("#dock");
  dock.classList.toggle("run", T.run);
  dock.classList.toggle("done", T.left <= 0);
  $("#tlabel").textContent = T.left <= 0 ? "Terminé" : (T.run ? "Pause" : (T.left < T.total ? "Reprendre" : "Lancer"));
}

function rankRows(counts, maxV) {
  const order = S.players.map((p, i) => ({ p, i, c: counts[i] })).sort((a, b) => b.c - a.c || a.p.name.localeCompare(b.p.name));
  let rk = 0, prev = null;
  return order.map((o, idx) => {
    if (o.c !== prev) { rk = idx + 1; prev = o.c; }
    const top = order[0].c;
    const win = o.c === top && top > 0;
    const c = byId(S.hands[o.i] ? S.hands[o.i].cand : o.p.cand), pt = PARTIES[c.pt];
    const w = maxV ? Math.max(4, Math.round(100 * o.c / maxV)) : 4;
    return `<div class="prow ${win ? "win" : ""}" style="--c1:${pt.c1};--c2:${pt.c2}">
      ${win ? '<span class="crown">👑</span>' : ""}
      <div class="rank">${rk}</div>
      <div><div class="nm">${esc(o.p.name)}</div><div class="cn">${esc(c.nom)}</div><div class="bar"><i style="width:${w}%"></i></div></div>
      <div class="sc">${o.c}<small>vote${o.c > 1 ? "s" : ""}</small></div></div>`;
  }).join("");
}

}
function go(s) { S.screen = s; window.scrollTo(0, 0); render(); }
function confetti() {
  const old = $("#confetti"); if (old) old.remove();
  const box = document.createElement("div"); box.className = "confetti"; box.id = "confetti";
  const cols = ["#0b2a6f", "#ffffff", "#d6202f", "#4a7be0", "#f3c64a"];

}

/* ============ ACTIONS ============ */
function resetPlayers() {
  S.players = S.players.map(p => ({ name: p.name, cand: null, seen: [], total: 0 }));
  S.taken = new Set(); S.cur = 0; S.round = 0; S.usedThemes = []; S.results = [];
}
const A = {
  brand() { if (INGAME.includes(S.screen)) A.quit(); else A.home(); },
  home() { stopTimer(); S.modal = null; if (S.online) { onlineLeave(); return; } go("home"); },
  gallery() { go("gallery"); },
  how() { S.modal = { type: "how" }; render(); },
  closeModal() { S.modal = null; render(); },
  closeModalBg(d, el, e) { if (e.target === el) { S.modal = null; render(); } },
  quit() { S.modal = { type: "quit" }; render(); },
  confirmQuit() { stopTimer(); S.modal = null; if (S.online) { onlineLeave(); return; } go("home"); },
  openCand(d) { S.modal = { type: "cand", id: d.id }; render(); },
  setEra(d) { S.galEra = d.v; render(true); },
  setGalTheme(d) { S.galTheme = d.v; render(true); },
  new() { S.online = false; S.onFinal = null; S.dp = null; S.tiebreak = false; go("setup"); },
  setN(d) { S.n = +d.v; render(true); },
  setRounds(d) { S.rounds = +d.v; render(true); },
  setRythme(d) { S.rythme = d.v; render(true); },
  start() {
    const seen = new Set();
    const names = [];
    for (let i = 0; i < S.n; i++) {
      let nm = (S.names[i] || "").trim() || ("Joueur " + (i + 1));
      let base = nm, k = 2;
      while (seen.has(nm.toLowerCase())) nm = base + " " + (k++);
      seen.add(nm.toLowerCase()); names.push(nm);
    }
    S.names = names;
    S.players = names.map(n => ({ name: n, cand: null, seen: [], total: 0 }));
    S.taken = new Set(); S.cur = 0; S.round = 0; S.usedThemes = []; S.results = [];
    go("passDuel");
  },
  ready() { startDuels(S.players[S.cur]); go("duel"); },
  pick(d) { pick(d.side); },
  cardNext() {
    if (S.cur < S.players.length - 1) { S.cur++; go("passDuel"); }
    else { S.round = 0; setupRound(); go("theme"); }
  },
  beginRound() { if (S.online) { osend({ t: "beginDebate" }); return; } go("debate"); },
  timer() { if (S.online) { osend({ t: "timer" }); return; } toggleTimer(); },
  stepNext() {
    if (S.online) { if (S.stepIdx < S.steps.length - 1) osend({ t: "step", idx: S.stepIdx + 1 }); else osend({ t: "toVote" }); return; }
    if (S.stepIdx < S.steps.length - 1) { S.stepIdx++; setTimer(S.steps[S.stepIdx].sec); render(true); window.scrollTo({ top: 0 }); }
    else { stopTimer(); S.vote = { i: 0, sel: null, picks: [] }; go("passVote"); }
  },
  stepPrev() { if (S.online) { if (S.stepIdx > 0) osend({ t: "step", idx: S.stepIdx - 1 }); return; } if (S.stepIdx > 0) { S.stepIdx--; setTimer(S.steps[S.stepIdx].sec); render(true); } },
  voteReady() { go("vote"); },
  selVote(d) { S.vote.sel = +d.j; render(true); },
  confirmVote() {
    if (S.online) { if (S.vote.sel == null) return; const tg = S.players[S.vote.sel]; S.vote.sel = null; osend({ t: "vote", target: tg.id }); return; }
    const v = S.vote; if (v.sel == null) return;
    v.picks[v.i] = v.sel; v.sel = null;
    if (v.i < S.players.length - 1) { v.i++; go("passVote"); }
    else {
      const counts = S.players.map(() => 0);
      v.picks.forEach(j => counts[j]++);
      S.results[S.round] = { counts };
      S.players.forEach((p, i) => p.total += counts[i]);
      go("results");
    }
  },
  nextRound() { if (S.online) { onlineStartRound(); return; } S.round++; setupRound(); go("theme"); },
  final() { if (S.online) { osend({ t: "final" }); return; } go("final"); },
  rematch() { if (S.online) { osend({ t: "rematch" }); return; } resetPlayers(); go("passDuel"); }
};

/* ============ MODE EN LIGNE (chacun son téléphone) ============ */
const O = { ws: null, code: null, pid: null, token: null, s: null, off: 0, name: "", codeIn: "", err: "", busy: false, retry: 0, beeped: null };
const SKEY = "grandDebat.session";
const PAL = ["#2147a6", "#d62f4c", "#33a853", "#f08a24", "#7a49c4", "#1c93c9", "#e8457e", "#139287"];
const palOf = i => { const c = PAL[i % PAL.length]; return `--c1:${c};--c2:${c}`; };

function saveSession() { try { sessionStorage.setItem(SKEY, JSON.stringify({ code: O.code, pid: O.pid, token: O.token, name: O.name })); } catch (e) { } }
function loadSession() { try { return JSON.parse(sessionStorage.getItem(SKEY) || "null"); } catch (e) { return null; } }
function clearSession() { try { sessionStorage.removeItem(SKEY); } catch (e) { } }
function wsURL() { return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"; }
function osend(m) { if (O.ws && O.ws.readyState === 1) { O.ws.send(JSON.stringify(m)); return true; } return false; }
const isHost = () => !!(O.s && O.s.host === O.pid);

function toast(msg) {
  const t = $("#toast"); if (!t) return;
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 3500);
}
function setConn(ok) { const c = $("#conn"); if (c) c.classList.toggle("on", !ok); }

function oconnect() {
  return new Promise((resolve, reject) => {
    let ws; try { ws = new WebSocket(wsURL()); } catch (e) { reject(e); return; }
    O.ws = ws; let opened = false;
    ws.onopen = () => { opened = true; O.retry = 0; setConn(true); resolve(); };
    ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } onMsg(m); };
    ws.onclose = () => {
      if (O.ws !== ws) return;
      if (!opened) { reject(new Error("close")); return; }
      if (O.pid) { setConn(false); oreconnect(); }
    };
    ws.onerror = () => { };
  });
}
function oreconnect() {
  if (!O.pid) return;
  const d = Math.min(8000, 700 * Math.pow(1.6, O.retry++));
  setTimeout(() => {
    if (!O.pid) return;
    oconnect().then(() => osend({ t: "rejoin", code: O.code, pid: O.pid, token: O.token })).catch(() => oreconnect());
  }, d);
}
function resetOnline() {
  O.pid = null; O.code = null; O.token = null; O.s = null; O.busy = false;
  S.online = false; S.onFinal = null; S.dp = null; S.tiebreak = false; S.me = -1;
  stopTimer();
}
function onlineLeave() {
  osend({ t: "leave" }); clearSession();
  const ws = O.ws; resetOnline();
  try { if (ws) ws.close(); } catch (e) { }
  go("home");
}

function onMsg(m) {
  if (m.t === "joined") {
    O.code = m.code; O.pid = m.pid; O.token = m.token; O.busy = false; O.err = ""; saveSession(); S.online = true;
  } else if (m.t === "state") {
    onState(m.s);
  } else if (m.t === "error") {
    O.busy = false;
    if (m.fatal) { clearSession(); resetOnline(); O.err = m.msg; go("o-menu"); }
    else { O.err = m.msg; if (S.screen === "o-menu") render(true); else toast(m.msg); }
  } else if (m.t === "conflict") {
    onConflict(m.taken);
  }
}

/* ----- miroir de l’état serveur dans S (pour réutiliser les vues existantes) ----- */
function mirror() {
  const s = O.s; if (!s) return;
  const idx = {}; s.players.forEach((p, i) => idx[p.id] = i);
  S.me = s.players.findIndex(p => p.id === O.pid);
  S.rounds = s.settings.rounds; S.rythme = s.settings.rythme; S.round = s.round;
  S.players = s.players.map(p => ({ id: p.id, name: p.name, cand: p.cand, total: s.totals[p.id] || 0 }));
  S.taken = new Set(s.taken);
  S.theme = s.theme;
  S.hands = (s.theme && THEMES[s.theme]) ? S.players.map(p => {
    const c = byId(p.cand); const st = c ? (c.s[s.theme] || null) : null;
    return { cand: p.cand, st, joker: (c && !st) ? jokerText(c) : null };
  }) : [];
  S.steps = (s.steps || []).map(st => ({
    k: st.k, t: st.t, sec: st.sec, h: st.h,
    who: st.who ? st.who.map(id => idx[id]).filter(i => i != null) : null,
    tgt: st.tgt != null ? idx[st.tgt] : undefined
  }));
  S.stepIdx = s.stepIdx;
  S.results = s.results.map(r => ({ counts: s.players.map(p => r.counts[p.id] || 0) }));
}
function syncTimerFromServer() {
  const tm = O.s && O.s.timer; if (!tm) return;
  const now = Date.now() + O.off;
  T.total = tm.total; T.run = tm.running;
  T.left = tm.running ? Math.max(0, tm.left - (now - tm.at) / 1000) : tm.left;
}
setInterval(() => {
  if (S.online && S.screen === "debate" && O.s) {
    syncTimerFromServer(); paintTimer();
    const tm = O.s.timer;
    if (T.left <= 0 && tm.running && O.beeped !== tm.at) { O.beeped = tm.at; beep(); }
  }
}, 200);

function onState(s) {
  O.s = s; O.off = s.now - Date.now();
  mirror(); route();
}
function route() {
  const s = O.s, me = s.players.find(p => p.id === O.pid);
  if (!me) { resetOnline(); O.err = "Tu n’es plus dans cette salle."; go("o-menu"); return; }
  let t = "o-lobby";
  switch (s.phase) {
    case "lobby": t = "o-lobby"; break;
    case "duels": t = me.cand ? "o-card" : (["duel", "o-duelintro", "o-pickwait"].includes(S.screen) ? S.screen : "o-duelintro"); break;
    case "theme": t = "theme"; break;
    case "debate": t = "debate"; break;
    case "vote": t = s.voted.includes(O.pid) ? "o-votewait" : "o-vote"; break;
    case "results": t = "results"; break;
    case "final": t = "final"; break;
  }
  if (t === "o-vote" && S.screen !== "o-vote") S.vote = { i: S.me, sel: null, picks: [] };
  if (t === "o-card") S.tiebreak = false;
  if (t !== S.screen) { S.screen = t; window.scrollTo(0, 0); render(); }
  else if (t === "duel" || t === "o-duelintro" || t === "o-pickwait") paintProg();
  else render(true);
  if (t === "o-duelintro") paintProg();
}
function paintProg() {
  const el = $("#oprog"); if (!el || !O.s) return;
  const done = O.s.players.filter(p => p.cand).length, n = O.s.players.length;
  el.textContent = done + " joueur" + (done > 1 ? "s" : "") + " sur " + n + " ont terminé leurs duels";
}

/* ----- duels en ligne ----- */
function onlineFinal(w) {
  S.screen = "o-pickwait"; render(true);
  osend({ t: "pick", cand: w.id });
}
function onConflict(taken) {
  S.taken = new Set(taken); S.tiebreak = true;
  const pool = CANDS.filter(c => !S.taken.has(c.id));
  const a = (S.lastLoser && !S.taken.has(S.lastLoser)) ? byId(S.lastLoser) : rand(pool);
  const b = rand(pool.filter(c => c.id !== a.id));
  S.duel = { n: 10, a: a.id, b: b.id, picked: null };
  S.screen = "duel"; window.scrollTo(0, 0); render();
}
function onlineStartRound() {
  const r = planRound();
  osend({
    t: "startRound", theme: r.theme,
    steps: r.steps.map(st => ({
      k: st.k, t: st.t, sec: st.sec, h: st.h,
      who: st.who ? st.who.map(i => S.players[i].id) : null,
      tgt: st.tgt != null ? S.players[st.tgt].id : undefined
    }))
  });
}

      : `<p class="muted">${set.rounds} manche${set.rounds > 1 ? "s" : ""} · rythme ${esc(r.nom.toLowerCase())}. Les réglages sont choisis par l’hôte.</p>`}
      <p class="hint">Environ ${est(Math.max(n, s.min), r)} minutes de débat par manche.</p>
    </div>
    <div class="row mt">${host
      ? `<button class="btn primary big" data-act="oStart" ${n < s.min ? "disabled" : ""}>Lancer les duels →</button>${n < s.min ? `<span class="muted">Il faut au moins ${s.min} joueurs.</span>` : ""}`
      : `<p class="muted">⏳ L’hôte lance la partie quand tout le monde est là…</p>`}</div>
  </section>`;
}
function viewODuelIntro() {
  const me = O.s.players.find(p => p.id === O.pid);
  return `<section class="scr pass"><div class="box">
    <div class="bubble">⚔️</div>
    <div class="kicker">Salle ${esc(O.code)}</div>
    <h2>À toi de jouer, <em>${esc(me.name)}</em></h2>
    <p class="lead" style="margin:0 auto 22px">Dix duels, sur ton téléphone, en même temps que les autres. Le vainqueur de chaque duel reste en piste : le dernier devient ton candidat.</p>
    <button class="btn primary big" data-act="oReady">C’est parti</button>
    <p class="hint" id="oprog" style="margin-top:14px"></p>
  </div></section>`;
}
function viewOCard() {
  const s = O.s, host = isHost();
  const me = s.players.find(p => p.id === O.pid), c = byId(me.cand);
  const ideas = Object.entries(c.s).map(([k, v]) => `<div class="idea"><div class="ic">${THEMES[k].ico}</div><div><b>${esc(v[0])}</b><span>${esc(THEMES[k].nom)}</span></div></div>`).join("");
  const live = s.players.filter(p => p.on), done = s.players.filter(p => p.cand).length;
  const ready = live.every(p => p.cand) && done >= 2;
  const rows = s.players.map((p, i) => `<div class="vopt" style="${palOf(i)};cursor:default"><div class="mono">${initials(p.name)}</div><div><b>${esc(p.name)}${p.id === O.pid ? " (toi)" : ""}</b><span>${p.cand ? "✓ a choisi son candidat" : (p.on ? "encore en duel…" : "hors ligne")}</span></div></div>`).join("");
  return `<section class="scr">
    <div class="dhead"><div><div class="kicker">${esc(me.name)} · ta carte</div><h2>Voici ton candidat</h2></div></div>
    <div class="reveal">${cardHTML(c, { cls: "big", bio: true })}
      <div>
        <p class="lead">Pendant le débat, tu parleras à la place de ${esc(c.nom)}.</p>
        <h3 style="margin:18px 0 4px">Ses grandes idées</h3>
        <div class="ideas">${ideas}</div>
        <div class="panel mt"><h2 style="font-size:1.2rem">${done} sur ${s.players.length} ont fini leurs duels</h2><div class="vlist">${rows}</div></div>
        <div class="row mt">${host
      ? `<button class="btn primary big" data-act="oStartRound" ${ready ? "" : "disabled"}>Lancer le débat →</button>${ready ? "" : `<span class="muted">En attendant les autres…</span>`}`
      : `<p class="muted">⏳ L’hôte lancera le débat quand tout le monde aura fini.</p>`}</div>
      </div>
    </div></section>`;
}
function viewOVoteWait() {
  const s = O.s, host = isHost();
  const live = s.players.filter(p => p.on).length, v = s.voted.length;
  return `<section class="scr pass"><div class="box">
    <div class="bubble">🗳️</div>
    <div class="kicker">Manche ${s.round + 1} sur ${s.settings.rounds}</div>
    <h2>Vote enregistré</h2>
    <p class="lead" style="margin:0 auto 18px">${v} joueur${v > 1 ? "s ont" : " a"} voté sur ${live}. Les résultats apparaissent dès que tout le monde a voté.</p>
    ${host && v >= 1 && v < live ? `<button class="btn" data-act="oFinishVote">Afficher les résultats maintenant</button>` : ""}
  </div></section>`;
}

/* ----- actions en ligne ----- */
Object.assign(A, {
  oMenu() { S.online = false; O.err = ""; if (!O.name) { const ses = loadSession(); if (ses && ses.name) O.name = ses.name; } go("o-menu"); },
  async oCreate() {
    const name = (O.name || "").trim();
    if (!name) { O.err = "Entre ton prénom pour commencer."; render(true); return; }
    O.err = ""; O.busy = true; render(true);
    try { await oconnect(); osend({ t: "create", name }); }
    catch (e) { O.busy = false; O.err = "Impossible de joindre le serveur. Réessaie dans un instant."; render(true); }
  },
  async oJoin() {
    const name = (O.name || "").trim(), code = (O.codeIn || "").trim().toUpperCase();
    if (!name) { O.err = "Entre ton prénom pour commencer."; render(true); return; }
    if (code.length !== 4) { O.err = "Le code de la salle fait 4 lettres."; render(true); return; }
    O.err = ""; O.busy = true; render(true);
    try { await oconnect(); osend({ t: "join", code, name }); }
    catch (e) { O.busy = false; O.err = "Impossible de joindre le serveur. Réessaie dans un instant."; render(true); }
  },
  oShare() {
    const url = location.origin + location.pathname + "?salle=" + O.code;
    if (navigator.share) { navigator.share({ title: "Le Grand Débat", text: "Rejoins ma salle : " + O.code, url }).catch(() => { }); }
    else if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(() => toast("Lien copié !")).catch(() => toast(url)); }
    else toast(url);
  },
  oSettings(d) {
    const set = O.s.settings;
    osend({ t: "settings", rounds: d.k === "rounds" ? +d.v : set.rounds, rythme: d.k === "rythme" ? d.v : set.rythme });
  },
  oStart() { osend({ t: "start" }); },
  oReady() {
    const me = O.s.players.find(p => p.id === O.pid);
    S.dp = { name: me.name, seen: [] }; S.taken = new Set(O.s.taken);
    S.onFinal = onlineFinal; S.tiebreak = false; S.lastLoser = null;
    startDuels(S.dp); go("duel"); paintProg();
  },
  oStartRound() { onlineStartRound(); },
  oFinishVote() { osend({ t: "finishVote" }); }
});

document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.o;
  if (!k) return;
  if (k === "name") O.name = e.target.value;
  if (k === "code") { const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4); e.target.value = v; O.codeIn = v; }
});
document.addEventListener("click", () => { try { T.ctx = T.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (T.ctx.state === "suspended") T.ctx.resume(); } catch (e) { } }, { once: true });

function onlineBoot() {
  const q = new URLSearchParams(location.search);
  const c = (q.get("salle") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  if (c) O.codeIn = c;
  const ses = loadSession();
  if (ses && ses.code && ses.pid && ses.token) {
    O.code = ses.code; O.pid = ses.pid; O.token = ses.token; O.name = ses.name || "";
    S.screen = "o-connecting"; render();
    oconnect().then(() => osend({ t: "rejoin", code: O.code, pid: O.pid, token: O.token }))
      .catch(() => { clearSession(); resetOnline(); go("home"); });
  } else if (c) { A.oMenu(); }
}

render();
onlineBoot();
</script>
</body>
</html>
